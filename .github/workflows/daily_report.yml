name: 择校日报

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install google-genai httpx python-dotenv

      - name: 运行收集器
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python collector.py

      - name: 发布日报到 Pages
        run: |
          latest=$(ls reports/*.html 2>/dev/null | tail -1)
          if [ -n "$latest" ]; then
            cp "$latest" docs/index.html
            git config user.name "github-actions"
